    <style>
        :root{--bg-primary:#1a1d23;--bg-card:#282c34;--bg-input:#1e2128;--text-primary:#e1e4e8;--text-secondary:#8b949e;--text-muted:#6e7681;--accent-steel:#4a5568;--accent-blue:#58a6ff;--accent-blue-glow:rgba(88,166,255,0.3);--accent-purple:#8b5cf6;--error:#f85149;--error-glow:rgba(248,81,73,0.3);--border:#30363d;--shadow-xl:0 20px 60px rgba(0,0,0,0.6);--radius-sm:8px;--radius:12px;--radius-xl:20px;--transition:all 0.25s ease}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins','Noto Sans Bengali',sans-serif;background:var(--bg-primary);background-image:radial-gradient(ellipse at 20% 20%,rgba(88,166,255,0.03),transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(139,92,246,0.03),transparent 50%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        .container{width:100%;max-width:420px;animation:slideUp 0.6s ease-out}
        .badge{text-align:center;margin-bottom:12px}
        .badge span{display:inline-block;background:var(--bg-card);color:var(--error);padding:6px 16px;border-radius:50px;font-size:0.8rem;font-weight:600;border:1px solid rgba(248,81,73,0.3)}
        .header{text-align:center;margin-bottom:24px}
        .logo-img{width:65px;height:65px;border-radius:14px;object-fit:contain;background:var(--bg-input);padding:6px;border:2px solid var(--border);margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
        .header h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header p{font-size:0.9rem;color:var(--text-secondary);margin-top:4px}
        .card{background:var(--bg-card);border-radius:var(--radius-xl);padding:32px 28px;box-shadow:var(--shadow-xl);border:1px solid var(--border);position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-steel),var(--accent-blue),var(--accent-purple))}
        .avatar{text-align:center;margin-bottom:20px}
        .avatar div{width:70px;height:70px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 25px var(--accent-blue-glow)}
        .form{display:flex;flex-direction:column;gap:18px}
        .form-group{display:flex;flex-direction:column;gap:5px}
        label{font-weight:600;font-size:0.85rem;color:var(--text-primary)}
        input{width:100%;padding:13px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.92rem;color:var(--text-primary);font-family:inherit;transition:var(--transition)}
        input:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 4px var(--accent-blue-glow)}
        .pw-wrap{position:relative}.pw-wrap input{padding-right:46px}
        .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:var(--text-muted);display:flex;align-items:center}.pw-toggle:hover{color:var(--accent-blue)}
        .error-msg{color:var(--error);font-size:0.78rem;min-height:16px}
        .login-error{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.3);color:var(--error);padding:10px 14px;border-radius:var(--radius-sm);text-align:center;display:none;font-size:0.85rem}.login-error.show{display:block}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition);font-family:inherit;box-shadow:0 6px 20px var(--accent-blue-glow)}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px var(--accent-blue-glow)}
        .back{display:block;text-align:center;margin-top:14px;color:var(--accent-blue);text-decoration:none;font-weight:500;font-size:0.85rem}.back:hover{text-decoration:underline}
        footer{text-align:center;margin-top:18px;color:var(--text-muted);font-size:0.78rem}
    </style>

<body>
<div class="container">
    <div class="badge"><span>🔒 Restricted Access</span></div>
    <header class="header">
        <img src="https://picture-link-generator.rf.gd/uploads/image-selector.png" alt="Image Selector Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>অ্যাডমিন লগইন</h1>
        <p>নিরাপদ প্রশাসক প্যানেল</p>
    </header>
    <div class="card">
        <div class="avatar"><div>👑</div></div>
        <form id="loginForm" class="form" novalidate>
            <div class="form-group"><label>👤 ইউজারনেম</label><input type="text" id="username" placeholder="ইউজারনেম লিখুন"><span class="error-msg" id="usernameError"></span></div>
            <div class="form-group"><label>🔑 পাসওয়ার্ড</label>
                <div class="pw-wrap"><input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
                    <button type="button" class="pw-toggle" id="togglePw">
                        <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        <svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div><span class="error-msg" id="passwordError"></span>
            </div>
            <div class="login-error" id="loginError">❌ ভুল ইউজারনেম বা পাসওয়ার্ড</div>
            <button type="submit" class="btn">🔓 লগইন করুন</button>
        </form>
        <a href="index.html" class="back">← হোম পেজে ফিরুন</a>
    </div>
    <footer>© 2024 ইমেজ সিলেক্টর • অ্যাডমিন প্যানেল</footer>
</div>
<script>
if(sessionStorage.getItem('adminLoggedIn')==='true'){window.location.href='dashboard.html'}
const tp=document.getElementById('togglePw'),eo=document.getElementById('eyeOff'),en=document.getElementById('eyeOn'),pw=document.getElementById('password');
tp.addEventListener('click',function(){if(pw.type==='password'){pw.type='text';eo.style.display='none';en.style.display='block'}else{pw.type='password';eo.style.display='block';en.style.display='none'}});
document.getElementById('username').addEventListener('input',function(){document.getElementById('usernameError').textContent='';document.getElementById('loginError').classList.remove('show')});
pw.addEventListener('input',function(){document.getElementById('passwordError').textContent='';document.getElementById('loginError').classList.remove('show')});
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=pw.value.trim();let err=false;if(!u){document.getElementById('usernameError').textContent='❌ ইউজারনেম প্রয়োজন';err=true}if(!p){document.getElementById('passwordError').textContent='❌ পাসওয়ার্ড প্রয়োজন';err=true}if(err)return;if(u==='FG2026'&&p==='FG26'){sessionStorage.setItem('adminLoggedIn','true');window.location.href='dashboard.html'}else{document.getElementById('loginError').classList.add('show');pw.value='';pw.focus()}});
</script>
</body>
</html>
